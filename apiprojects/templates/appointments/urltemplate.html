{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site.salon_name|default:"Michelle's Salon" }}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'appointments/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'appointments/css/reviews.css' %}">
    <link rel="stylesheet" href="{% static 'appointments/css/sections.css' %}">
    <link rel="stylesheet" href="{% static 'appointments/css/frame.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="layout">
        {% include "appointments/_navbar.html" %}

        {% block content %}{% endblock %}

        {% include "appointments/_footer.html" %}
    </div>

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="{% static 'appointments/javascript/scrollbar.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Salon Appointments{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #faf7f5; color: #2b2b2b; margin: 0; }
    header { background: #3b2a35; padding: 1rem 2rem; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .btn { display: inline-block; padding: .45rem .9rem; border-radius: 6px; border: none;
           background: #b5527b; color: #fff; text-decoration: none; cursor: pointer; font-size: .95rem; }
    .btn.secondary { background: #e7dfe3; color: #3b2a35; }
    .btn.danger { background: #c0392b; }
    .messages { list-style: none; padding: 0; }
    .messages li { background: #e6f4ea; border-left: 4px solid #2e8b57; padding: .6rem 1rem;
                   border-radius: 6px; margin-bottom: .5rem; }
    .errorlist { color: #c0392b; list-style: none; padding: 0; margin: .25rem 0; font-size: .9rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-weight: 600; margin-bottom: .25rem; }
    .field input, .field select, .field textarea { width: 100%; padding: .5rem; border: 1px solid #ccc;
                                                    border-radius: 6px; box-sizing: border-box; font: inherit; }
    .muted { color: #777; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'appointment_list' %}">💇 Salon Appointments</a>
  </header>

  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
